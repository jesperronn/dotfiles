symbolPreset: unicode
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  web: openai-codex/gpt-5.6-luna
  tiny: omlx/Ornith-1.5-9B-MLX-4bit
  smol: omlx/Ornith-1.5-9B-MLX-4bit
  default: omlx/Ornith-1.5-35B-A3B-MLX-4bit
defaultThinkingLevel: auto
task:
  maxConcurrency: 4
  batch: true
  enableLsp: true
  maxRecursionDepth: 1
  isolation:
    commits: ai
composer:
  shape: field
tui:
  tight: false
steeringMode: all
followUpMode: one-at-a-time
tools:
  approvalMode: yolo
  artifactTailLines: 250
magicKeywords:
  enabled: true
  orchestrate: true
  workflow: true
features:
  unexpectedStopDetection: smart
git:
  enabled: true
compaction:
  handoffSaveToDisk: true
  remoteStreamingV2Enabled: true
  idleEnabled: true
  idleThresholdTokens: 100000
extendedContext: false
branchSummary:
  enabled: false
snapcompact:
  shape: auto
autolearn:
  enabled: true
memory:
  backend: local
edit:
  mode: replace
read:
  toolResultPreview: false
lsp:
  formatOnWrite: true
bash:
  autoBackground:
    enabled: true
bashInterceptor:
  enabled: false
shellMinimizer:
  sourceOutlineLevel: default
astGrep:
  enabled: true
launch:
  enabled: true
computer:
  enabled: true
checkpoint:
  enabled: true
security:
  enabled: true
todo:
  remindersMax: 5
  eager: preferred
github:
  cache:
    enabled: true
dev:
  autoqa: true
retry:
  fallbackChains:
    {}
prewalk:
  enabled: true
startup:
  checkUpdate: false
  quiet: true
  changelogMode: hidden
web_search:
  enabled: true
tasks:
  todoClearDelay: -1